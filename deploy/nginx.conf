map "$request_method:$uri" $webguard_scan_peer {
    default "";
    "POST:/api/v1/scans" $binary_remote_addr;
}

limit_req_zone $webguard_scan_peer zone=webguard_scans:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=webguard_connections:10m;

upstream webguard_api {
    server backend:8000;
    keepalive 8;
}

server {
    listen 8080 default_server;
    server_name "";
    return 444;
}

server {
    listen 8080;
    server_name webguard.example.invalid;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 4k;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'" always;

    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location /api/ {
        limit_req zone=webguard_scans burst=2 nodelay;
        limit_req_status 429;
        limit_conn webguard_connections 8;
        limit_conn_status 503;

        proxy_pass http://webguard_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 95s;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_cache off;

        # The application also emits these when reached directly. Hide its copies so this
        # deployment edge has one authoritative, non-conflicting policy.
        proxy_hide_header Cache-Control;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
