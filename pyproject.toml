[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cybernet-webguard"
version = "0.1.0.dev0"
description = "A safe, low-impact web security posture auditing foundation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "CyberNet" }]
dependencies = [
  "httpcore>=1.0,<2",
  "httpx>=0.27,<1",
  "idna>=3.7,<4",
  "pydantic>=2.8,<3",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/webguard"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra -m 'not live'"
asyncio_mode = "auto"
testpaths = ["backend/tests"]
markers = [
  "live: opt-in harmless tests that access public Internet targets",
  "security: security-boundary and SSRF regression tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = ["S101"]
"backend/src/webguard/security/transport.py" = ["ASYNC109"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["webguard"]
mypy_path = "backend/src"
warn_unreachable = true
show_error_codes = true

[tool.coverage.run]
branch = true
source = ["webguard"]

[tool.coverage.report]
show_missing = true
skip_covered = true
